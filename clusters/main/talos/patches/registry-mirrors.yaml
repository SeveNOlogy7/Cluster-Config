machine:
  # CN 网络加速: 各 registry 走可达镜像端点, 失败自动回退源站 (containerd 按序尝试)
  #Talos >=1.14: CRI 配置变更热应用, 无需重启
  registries:
    mirrors:
      ghcr.io:
        endpoints:
          - ${REGISTRY_GHCR_MIRROR}
          - https://ghcr.io
      docker.io:
        endpoints:
          - ${REGISTRY_DOCKER_MIRROR}
          - https://registry-1.docker.io
      registry.k8s.io:
        endpoints:
          - ${REGISTRY_K8S_MIRROR}
          - https://registry.k8s.io
      quay.io:
        endpoints:
          - ${REGISTRY_QUAY_MIRROR}
          - https://quay.io
