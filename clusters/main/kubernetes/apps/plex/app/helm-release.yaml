apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: plex
spec:
  interval: 15m
  chart:
    spec:
      chart: plex
      version: 22.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  timeout: 20m
  values:
    TZ: Asia/Shanghai
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: plex.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${PLEX_IP}
        ports:
          main:
            protocol: http
            port: 32400
            targetPort: 32400
    persistence:
      config:
        enabled: true
        mountPath: /config
      transcode:
        enabled: true
        type: emptyDir
        medium: Memory
        mountPath: /transcode
      movies:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_MOVIE_PATH}
        mountPath: /media/movie
      tv:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_TV_PATH}
        mountPath: /media/tv
      series:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_SERIES_PATH}
        mountPath: /media/series
    plex:
      serverIP: ${PLEX_IP}
      disableGDM: true
      requireHTTPS: false
