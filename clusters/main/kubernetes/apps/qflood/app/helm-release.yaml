apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qflood
  namespace: qflood
spec:
  interval: 15m
  chart:
    spec:
      chart: qflood
      version: 12.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    # image: unset on purpose - chart 12.0.4 default is the official
    # containerforge image (oci.trueforge.org/containerforge/qflood:5.3.0@sha256:08f0c1...)
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: qflood.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      config:
        enabled: true
        mountPath: /config
        # mount to all containers so the seed init container sees the PVC
        targetSelectAll: true
      data:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${BT_DATA_PATH}
        mountPath: /mnt/data
    workload:
      main:
        podSpec:
          initContainers:
            # The flood binary connects to qBittorrent with the fixed credentials
            # dummy/dummy, but nothing in the image seeds those credentials into
            # qBittorrent's config. Without this seed, qBittorrent falls back to
            # "admin" + a random per-session password; flood's login retries then
            # trigger the WebUI IP ban on 127.0.0.1 and the UI shows
            # "Cannot connect to the client."
            # Idempotent on every pod start; survives fresh and existing PVCs.
            # containerforge layout (chart >=11): qBittorrent config dir is
            # /config/qBittorrent (old engels74/hotio layout was /config/config).
            # The old conf was pre-migrated to the new path on 2026-11-13 before
            # the chart bump. FLOOD_AUTH=true means flood requires a manual
            # first-visit connect (dummy/dummy) after the upgrade.
            seed-qbittorrent-config:
              enabled: true
              type: init
              imageSelector: image
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  HASH='${QFLOOD_QB_WEBUI_HASH}'
                  QBUSER='${QFLOOD_QB_USER}'
                  CONF=/config/qBittorrent/qBittorrent.conf
                  mkdir -p /config/qBittorrent
                  [ -f "$CONF" ] || : > "$CONF"
                  # drop previously injected lines so the seed stays idempotent
                  # NOTE: shell vars are referenced WITHOUT curly braces - flux's
                  # envsubst replaces any dollar-braced undefined placeholder
                  # with an empty string. The seed owns the injected keys:
                  # stale lines with ANY value are removed before re-adding
                  sed -i -e '/Password_PBKDF2/d' -e '/^WebUI\\Username=/d' -e '/^Username=/d' "$CONF"
                  # username must stay "dummy": the image hardcodes flood's
                  # qBittorrent login; hash format per qBittorrent source:
                  # PBKDF2-HMAC-SHA512, 100000 iterations, base64(salt):base64(key)
                  # KEY LAYOUT (the actual root cause, proven by live experiment
                  # 2026-11-14): qB >=5.0 reads the WebUI credentials from the
                  # [WebUI] section as BARE keys (QSettings key
                  # WebUI/Password_PBKDF2). The old [Preferences] + WebUI\-
                  # prefixed form is a DIFFERENT key (Preferences/WebUI/...) and
                  # is ignored by 5.x - identical hash bytes, still "password
                  # not set" at boot. 5.x's conf migration carries Username/Port
                  # but drops the password hash, so the seed must write the
                  # [WebUI] form on every start. The [Preferences] legacy block
                  # is kept ONLY so a git revert to the engels74 image (chart
                  # 9.9.0, qB 4.x) still finds credentials on the same PVC.
                  if grep -qF '[WebUI]' "$CONF"; then
                    sed -i "s|^\[WebUI\]$|[WebUI]\nUsername=$QBUSER\nPassword_PBKDF2=@ByteArray($HASH)|" "$CONF"
                  else
                    printf '\n[WebUI]\nUsername=%s\nPassword_PBKDF2=@ByteArray(%s)\n' "$QBUSER" "$HASH" >> "$CONF"
                  fi
                  if grep -qF '[Preferences]' "$CONF"; then
                    sed -i "s|^\[Preferences\]$|\[Preferences\]\nWebUI\\\\Username=$QBUSER\nWebUI\\\\Password_PBKDF2=@ByteArray($HASH)|" "$CONF"
                  else
                    printf '\n[Preferences]\nWebUI\\Username=%s\nWebUI\\Password_PBKDF2=@ByteArray(%s)\n' "$QBUSER" "$HASH" >> "$CONF"
                  fi
                  # default save path: must be seeded too, or a FRESH PVC would
                  # drop new torrents into a container-internal path (the image's
                  # /defaults conf carries no Session\\DefaultSavePath; data is
                  # mounted at /mnt/data). Set = replace, else insert under the
                  # [BitTorrent] section header.
                  if grep -qF 'Session\DefaultSavePath' "$CONF"; then
                    sed -i "s|^Session\\\\DefaultSavePath=.*|Session\\\\DefaultSavePath=/mnt/data|" "$CONF"
                  else
                    sed -i "s|^\[BitTorrent\]$|[BitTorrent]\nSession\\\\DefaultSavePath=/mnt/data|" "$CONF"
                  fi
          containers:
            main:
              env:
                FLOOD_AUTH: ${FLOOD_AUTH}
