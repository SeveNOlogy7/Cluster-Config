apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qflood
  namespace: qflood
spec:
  interval: 15m
  chart:
    spec:
      chart: qflood
      version: 9.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: qflood.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      config:
        enabled: true
        mountPath: /config
      data:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${BT_DATA_PATH}
        mountPath: /mnt/data
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                FLOOD_AUTH: ${FLOOD_AUTH}
