apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qflood
  namespace: qflood
spec:
  interval: 15m
  chart:
    spec:
      chart: qflood
      version: 12.0.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    # qflood s6 image runs `usermod` in init, writing to /etc/passwd -
    # fails on read-only rootfs (common v30 defaults it to true).
    # Authorized relaxation: readOnlyRootFilesystem only.
    securityContext:
      container:
        readOnlyRootFilesystem: false
    image:
      repository: ghcr.io/engels74/qflood
      pullPolicy: IfNotPresent
      tag: latest@sha256:008836201603047e4a5cbee13083f3716903b71ee3afc92fcb4d129579f582d7
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: qflood.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      config:
        enabled: true
        mountPath: /config
        # mount to all containers so the seed init container sees the PVC
        targetSelectAll: true
      data:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${BT_DATA_PATH}
        mountPath: /mnt/data
    workload:
      main:
        podSpec:
          initContainers:
            # The flood binary connects to qBittorrent with the fixed credentials
            # dummy/dummy, but nothing in the image seeds those credentials into
            # qBittorrent's config. Without this seed, qBittorrent falls back to
            # "admin" + a random per-session password; flood's login retries then
            # trigger the WebUI IP ban on 127.0.0.1 and the UI shows
            # "Cannot connect to the client."
            # Idempotent on every pod start; survives fresh and existing PVCs.
            seed-qbittorrent-config:
              enabled: true
              type: init
              imageSelector: image
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  HASH='${QFLOOD_QB_WEBUI_HASH}'
                  QBUSER='${QFLOOD_QB_USER}'
                  CONF=/config/config/qBittorrent.conf
                  mkdir -p /config/config
                  [ -f "$CONF" ] || : > "$CONF"
                  # drop previously injected lines so the seed stays idempotent
                  # NOTE: shell vars are referenced WITHOUT curly braces - flux's
                  # envsubst replaces any dollar-braced undefined placeholder
                  # with an empty string. The seed owns both injected keys:
                  # stale lines with ANY value are removed before re-adding
                  sed -i -e '/Password_PBKDF2/d' -e '/^WebUI\\Username=/d' "$CONF"
                  # username must stay "dummy": the image hardcodes flood's
                  # qBittorrent login; hash format per qBittorrent source:
                  # PBKDF2-HMAC-SHA512, 100000 iterations, base64(salt):base64(key)
                  if grep -qF '[Preferences]' "$CONF"; then
                    sed -i "s|^\[Preferences\]$|\[Preferences\]\nWebUI\\\\Username=$QBUSER\nWebUI\\\\Password_PBKDF2=@ByteArray($HASH)|" "$CONF"
                  else
                    printf '\n[Preferences]\nWebUI\\Username=%s\nWebUI\\Password_PBKDF2=@ByteArray(%s)\n' "$QBUSER" "$HASH" >> "$CONF"
                  fi
          containers:
            main:
              env:
                FLOOD_AUTH: ${FLOOD_AUTH}
