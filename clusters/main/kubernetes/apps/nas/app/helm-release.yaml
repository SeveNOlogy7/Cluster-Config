apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nas
  namespace: nas
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 15.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: nas.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    service:
      main:
        enabled: true
        type: ExternalIP
        externalIP: ${NAS_IP}
        ports:
          main:
            enabled: true
            port: 8080
            protocol: http
    workload:
      main:
        enabled: false
