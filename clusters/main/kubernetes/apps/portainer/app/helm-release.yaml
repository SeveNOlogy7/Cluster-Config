apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
  namespace: portainer
spec:
  interval: 15m
  chart:
    spec:
      chart: portainer
      version: 14.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    beImage:
      pullPolicy: IfNotPresent
      repository: portainer/portainer-ee
      tag: 2.45.3@sha256:a1d45613d38b14521b6a0d06d735aec5276c2b4f896a7b62ba34b2288a477b38
    ingress:
      main:
        enabled: true
        ingressClassName: external
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: HTTPS
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: portainer.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      cache:
        enabled: true
        type: emptyDir
        mountPath: /.cache
      data:
        enabled: true
        mountPath: /data
    portainer:
      edge_compute: false
      snapshot_interval: 5m
    rbac:
      main:
        enabled: true
        primary: true
        clusterWide: true
        rules:
          - apiGroups:
              - '*'
            resources:
              - '*'
            verbs:
              - '*'
    serviceAccount:
      main:
        enabled: true
        primary: true
    workload:
      main:
        replicas: 1
        podSpec:
          automountServiceAccountToken: true
