apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  interval: 15m
  chart:
    spec:
      chart: pgadmin
      version: 21.2.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    credentials:
      cloudflare:
        type: s3
        url: ${CF_URL}
        bucket: ${CF_BUCKET}
        accessKey: ${CF_ACCESSKEY}
        secretKey: ${CF_SECRETKEY}
        encrKey: ${CF_ENCRKEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: pgadmin.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ${PGADMIN_IP}
        ports:
          main:
            port: 10024
            # restricted securityContext (runAsNonRoot uid 5050) makes the
            # dpage/pgadmin4 image listen on 8080, not 80; probes and the
            # service targetPort must match the actual container port.
            targetPort: 8080
    persistence:
      config:
        enabled: true
        mountPath: /var/lib/pgadmin
    workload:
      main:
        replicas: 1
        podSpec:
          containers:
            main:
              env:
                PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
                PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
