apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      # long grace period so an in-flight job can finish instead of being killed on pod recreation
      terminationGracePeriodSeconds: 10800
      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: runner-data
          persistentVolumeClaim:
            claimName: gitea-runner-data
        - name: docker-data
          persistentVolumeClaim:
            claimName: gitea-runner-docker-data
      # native sidecar (requires k8s 1.29+): starts before, and shuts down after, the runner container
      initContainers:
        - name: dind
          image: docker:28.2.2-dind
          restartPolicy: Always
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: docker-data
              mountPath: /var/lib/docker
          startupProbe:
            exec:
              command: ["/usr/bin/test", "-S", "/var/run/docker.sock"]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["/usr/bin/test", "-S", "/var/run/docker.sock"]
      containers:
        - name: runner
          image: docker.io/gitea/runner:3.4.2
          env:
            - name: GITEA_INSTANCE_URL
              value: https://gitea.${DOMAIN_0}
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              value: ${GITEA_RUNNER_TOKEN}
            - name: GITEA_RUNNER_NAME
              value: k8s-runner
            # covers the runs-on values used by most published actions/workflows, plus a bare host fallback
            # NOTE: no spaces around commas - the entrypoint word-splits this value on whitespace
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest:docker://catthehacker/ubuntu:act-latest,ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04,self-hosted:host"
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: docker-socket
              mountPath: /var/run
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
