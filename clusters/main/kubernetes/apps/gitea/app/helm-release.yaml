apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 15m
  chart:
    spec:
      chart: gitea
      version: 24.20.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  timeout: 20m
  values:
    TZ: Asia/Shanghai
    admin:
      email: ${GITEA_ADMIN_EMAIL}
      password: ${GITEA_ADMIN_PASSWORD}
      username: ${GITEA_ADMIN_USERNAME}
    cnpg:
      main:
        backups:
          enabled: false
          credentials: cloudflare
          revision: "3"
        cluster:
          instances: 1
          singleNode: true
        database: gitea
        enabled: true
        mode: recovery
        password: ${GITEA_CNPG_PASSWORD}
        pgVersion: 16
        recovery:
          credentials: cloudflare
          revision: "2"
        user: gitea
    credentials:
      cloudflare:
        type: s3
        url: ${CF_URL}
        bucket: ${CF_BUCKET}
        accessKey: ${CF_ACCESSKEY}
        secretKey: ${CF_SECRETKEY}
        encrKey: ${CF_ENCRKEY}
    config:
      APP_NAME: Gitea
      RUN_MODE: prod
      nodeIP: ${NAS_IP}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: gitea.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        enabled: true
        mountPath: /data
        volsync:
          - name: data-cloudflare
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: false
            trigger:
              schedule: 10 1 * * *
