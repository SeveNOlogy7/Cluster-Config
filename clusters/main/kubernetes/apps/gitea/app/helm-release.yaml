apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 15m
  # volsync movers launch with no resources -> QoS BestEffort. Talos'
  # OOMController SIGKILLs besteffort cgroups under memory spikes (proven
  # 2026-11-16: gitea mover restic killed mid-scan, exit 137). A request
  # lifts the mover to Burstable so it is no longer a first-class victim.
  # postRenderers because the common chart does not pass moverResources.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ReplicationSource
              name: gitea-data-data-cloudflare
            patch: |-
              - op: add
                path: /spec/restic/moverResources
                value:
                  requests:
                    cpu: 500m
                    memory: 512Mi
  chart:
    spec:
      chart: gitea
      # >= 24.22.1: chart writes ALLOWED_HOST_LIST under [security], not the
      # deprecated [webhook] section (removed upstream in gitea v28)
      version: 28.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # timeout bumped 2026-11-16 (20m -> 25m) to force a new HR generation:
  # the renderer cache kept serving the pre-postRenderers manifest, so
  # the volsync moverResources patch never reached the live object
  timeout: 25m
  values:
    TZ: Asia/Shanghai
    admin:
      email: ${GITEA_ADMIN_EMAIL}
      password: ${GITEA_ADMIN_PASSWORD}
      username: ${GITEA_ADMIN_USERNAME}
    credentials:
      cloudflare:
        type: s3
        url: ${CF_URL}
        bucket: ${CF_BUCKET}
        accessKey: ${CF_ACCESSKEY}
        secretKey: ${CF_SECRETKEY}
        encrKey: ${CF_ENCRKEY}
    config:
      APP_NAME: Gitea
      RUN_MODE: prod
      nodeIP: ${NAS_IP}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: gitea.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        enabled: true
        mountPath: /data
        volsync:
          - name: data-cloudflare
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                # cron is evaluated in UTC: 01:10 Beijing time
                schedule: "10 17 * * *"
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlUsername: gitea
          postgresqlDatabase: gitea
          password: ${GITEA_CNPG_PASSWORD}
        operator:
          type: postgres
          mode: recovery
          pgVersion: 16
          cluster:
            instances: 1
            singleNode: true
          recovery:
            credentials: cloudflare
            revision: "2"
          backups:
            enabled: true
            credentials: cloudflare
            revision: "3"
            scheduledBackups:
              - name: daily-backup
                # CNPG crons are six-field (seconds first), evaluated in UTC: 02:00 Beijing time
                schedule: "0 0 18 * * *"
