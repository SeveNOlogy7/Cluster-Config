apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinymediamanager
  namespace: tinymediamanager
spec:
  interval: 15m
  chart:
    spec:
      chart: tinymediamanager
      version: 12.6.6
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    TZ: Asia/Shanghai
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
          traefik:
            enabled: false
        hosts:
          - host: tmm.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        enabled: true
        mountPath: /data
      movies:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_MOVIE_PATH}
        mountPath: /media/movies
      tvshows:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_TV_PATH}
        mountPath: /media/tvshows
      series:
        enabled: true
        type: nfs
        server: ${NAS_IP}
        path: /${PLEX_SERIES_PATH}
        mountPath: /media/series
